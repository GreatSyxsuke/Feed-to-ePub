<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSS → EPUB</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e3e3df; --accent:#2b6cb0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --card:#1f1f24; --ink:#ececea; --muted:#9a9a9a; --line:#33333a; --accent:#7fb3ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; }
  label { display:block; font-weight:600; margin:0 0 6px; font-size:14px; }
  .hint { color:var(--muted); font-weight:400; font-size:13px; }
  input[type=text], input[type=number] { width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:9px; background:transparent; color:var(--ink); font-size:15px; }
  select { padding:10px 12px; border:1px solid var(--line); border-radius:9px;
    background:transparent; color:var(--ink); font-size:15px; }
  .saved-row { display:flex; gap:8px; margin-top:10px; }
  .saved-row select { flex:1; min-width:0; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:160px; }
  .radios, .checks { display:flex; gap:18px; flex-wrap:wrap; margin-top:4px; }
  .radios label, .checks label { font-weight:400; display:flex; align-items:center; gap:8px; margin:0; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 20px; cursor:pointer; }
  .go { background:var(--accent); color:#fff; }
  .go:disabled { opacity:.5; cursor:default; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); padding:8px 14px; font-weight:400; }
  .bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #status { color:var(--muted); font-size:14px; }
  #log { margin-top:14px; font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--muted); white-space:pre-wrap; max-height:260px; overflow:auto;
    border-top:1px solid var(--line); padding-top:12px; display:none; }
  mark { background:transparent; color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RSS → EPUB</h1>
  <p class="sub">Turn an RSS/Atom feed into EPUB files for your e-ink reader.</p>

  <div class="card">
    <label for="feed">Feed URL</label>
    <input id="feed" type="text" placeholder="https://example.com/feed.xml" autocomplete="off" />
    <div class="saved-row">
      <select id="saved"><option value="">Saved feeds…</option></select>
      <button id="saveFeed" class="ghost" type="button">Save</button>
      <button id="removeFeed" class="ghost" type="button">Remove</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label for="count">Max articles <span class="hint">(0 = no limit)</span></label>
        <input id="count" type="number" min="0" value="20" />
      </div>
      <div>
        <label for="days">From the last … days <span class="hint">(0 = any time)</span></label>
        <input id="days" type="number" min="0" value="0" />
      </div>
    </div>

    <div style="margin-top:18px">
      <label>Output</label>
      <div class="radios">
        <label><input type="radio" name="mode" value="combined" checked /> One combined EPUB</label>
        <label><input type="radio" name="mode" value="individual" /> One EPUB per article (zipped)</label>
      </div>
    </div>

    <div style="margin-top:18px">
      <label>Options</label>
      <div class="checks">
        <label><input id="skipSeen" type="checkbox" checked /> Skip articles I've already downloaded</label>
        <label><input id="withImages" type="checkbox" checked /> Include images</label>
      </div>
    </div>
  </div>

  <div class="bar">
    <button id="go" class="go">Generate</button>
    <button id="reset" class="ghost" title="Forget which articles were already downloaded for this feed">Reset history</button>
    <span id="status"></span>
  </div>

  <div id="log"></div>
</div>

<script type="module">
import JSZip from "https://esm.sh/jszip@3.10.1";
import { Readability } from "https://esm.sh/@mozilla/readability@0.5.0";

/* ----- ⬅️ PASTE YOUR WORKER URL below (keep the /?url= on the end) ----- */
const PROXY = "https://rss-proxy.beebe-rick.workers.dev/?url=";
/* ---------------------------------------------------------------------- */

const $ = id => document.getElementById(id);
const logEl = $("log");
const statusEl = $("status");
function status(t){ statusEl.textContent = t; }
function log(t){ logEl.style.display = "block"; logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; }

const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const safe = s => (s||"untitled").trim().replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60) || "untitled";

async function fetchText(url){
  const res = await fetch(PROXY + encodeURIComponent(url));
  if(!res.ok) throw new Error("Fetch failed ("+res.status+")");
  return res.text();
}

async function fetchBytes(url){
  const res = await fetch(PROXY + encodeURIComponent(url));
  if(!res.ok) throw new Error("image fetch failed ("+res.status+")");
  return { buf: await res.arrayBuffer(), type: res.headers.get("Content-Type") || "" };
}

/* ---------- Feed parsing (RSS + Atom) ---------- */
function parseFeed(xmlText){
  const xml = new DOMParser().parseFromString(xmlText, "application/xml");
  if(xml.querySelector("parsererror")) throw new Error("Couldn't parse feed as XML.");
  const channelTitle = (xml.querySelector("channel > title, feed > title")?.textContent || "Articles").trim();
  const channelImage = (xml.querySelector("channel > image > url")?.textContent
    || xml.getElementsByTagName("itunes:image")[0]?.getAttribute("href")
    || xml.querySelector("feed > logo")?.textContent
    || xml.querySelector("feed > icon")?.textContent || "").trim();
  const nodes = [...xml.querySelectorAll("item, entry")];
  const items = nodes.map(n => {
    const q = sel => n.querySelector(sel);
    const title = (q("title")?.textContent || "Untitled").trim();
    const links = [...n.querySelectorAll("link")];
    const atom = links.find(l => l.getAttribute("href") && (l.getAttribute("rel")||"alternate") === "alternate");
    const link = (atom?.getAttribute("href")
      || n.querySelector("link")?.getAttribute("href")
      || n.querySelector("link")?.textContent || "").trim();
    const guid = (q("guid")?.textContent || q("id")?.textContent || link || title).trim();
    const dateStr = q("pubDate")?.textContent || q("published")?.textContent
      || q("updated")?.textContent || q("date")?.textContent || "";
    const d = dateStr ? new Date(dateStr) : null;
    const date = d && !isNaN(d) ? d : null;
    let author = (n.getElementsByTagName("dc:creator")[0]?.textContent
      || n.querySelector("author > name")?.textContent || "").trim();
    if(!author){
      const raw = (q("author")?.textContent || "").trim();
      if(raw && !raw.includes("@")) author = raw;   // skip bare email-style authors
    }
    const feedHtml = (n.getElementsByTagName("content:encoded")[0]?.textContent
      || n.getElementsByTagName("content")[0]?.textContent || "").trim();
    const summary = (q("description")?.textContent || q("summary")?.textContent || "").trim();
    return { title, link, guid, date, author, feedHtml, summary };
  });
  return { channelTitle, channelImage, items };
}

/* ---------- Full-text extraction ---------- */
function textLen(html){
  const d = new DOMParser().parseFromString(html || "", "text/html");
  return (d.body.textContent || "").trim().length;
}
async function getArticleHtml(it){
  // Always try the full page first — many feeds only publish a truncated excerpt,
  // even a long one, so we can't trust feed content by length alone.
  let fromPage = "";
  if(it.link){
    try {
      const doc = new DOMParser().parseFromString(await fetchText(it.link), "text/html");
      const base = doc.createElement("base"); base.href = it.link; doc.head.appendChild(base);
      const parsed = new Readability(doc).parse();
      fromPage = (parsed && parsed.content) || "";
    } catch(e){ /* fall back to feed content below */ }
  }
  // Use whichever source actually has the most text.
  const candidates = [fromPage, it.feedHtml, it.summary].filter(Boolean);
  if(!candidates.length) return "";
  return candidates.reduce((a, b) => textLen(b) > textLen(a) ? b : a);
}

/* ---------- Image handling (fetch, filter ads/trackers, convert) ---------- */
const AD_RE = /(doubleclick|googlesyndication|google-analytics|googletagmanager|scorecardresearch|quantserve|adservice|adsystem|adnxs|taboola|outbrain|criteo|facebook\.com\/tr|\/ads?[\/_.?-]|\/pixel|\/beacon|\/track(ing)?|1x1|spacer|blank\.gif)/i;

function pickImageUrl(img, baseUrl){
  let chosen = img.getAttribute("src") || img.getAttribute("data-src")
    || img.getAttribute("data-lazy-src") || img.getAttribute("data-original") || "";
  const srcset = img.getAttribute("srcset") || img.getAttribute("data-srcset") || "";
  if((!chosen || /^data:|placeholder|blank|spacer|1x1/i.test(chosen)) && srcset){
    // take the last (usually largest) candidate in the srcset
    chosen = srcset.split(",").map(s => s.trim().split(/\s+/)[0]).filter(Boolean).pop() || chosen;
  }
  if(!chosen || chosen.startsWith("data:")) return null;
  try { return new URL(chosen, baseUrl).toString(); } catch { return null; }
}

function isLikelyContentImage(img, url){
  if(AD_RE.test(url)) return false;
  const w = parseInt(img.getAttribute("width")) || 0;
  const h = parseInt(img.getAttribute("height")) || 0;
  if((w && w <= 2) || (h && h <= 2)) return false;      // tracking pixels
  if(w && h && w < 32 && h < 32) return false;          // tiny icons/spacers
  return true;
}

async function prepareImage(buf, contentType){
  const type = (contentType || "").split(";")[0].trim().toLowerCase();
  const asIs = { "image/jpeg":"jpg", "image/jpg":"jpg", "image/png":"png", "image/gif":"gif", "image/svg+xml":"svg" };
  if(asIs[type]) return { data: buf, ext: asIs[type], mediaType: type === "image/jpg" ? "image/jpeg" : type };
  // WebP / AVIF / unknown → convert to JPEG for e-reader compatibility
  try {
    const bmp = await createImageBitmap(new Blob([buf], { type: type || "image/*" }));
    const canvas = document.createElement("canvas");
    canvas.width = bmp.width; canvas.height = bmp.height;
    canvas.getContext("2d").drawImage(bmp, 0, 0);
    const out = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
    if(!out) return null;
    return { data: await out.arrayBuffer(), ext: "jpg", mediaType: "image/jpeg" };
  } catch(e){ return null; }
}

// Cover: prefer the feed's own logo/image, else the first embedded article image.
async function getCoverImage(feedImageUrl, chapters){
  if(feedImageUrl){
    try {
      const { buf, type } = await fetchBytes(new URL(feedImageUrl).toString());
      const prep = await prepareImage(buf, type);
      if(prep) return prep;
    } catch(e){ /* fall through to article image */ }
  }
  for(const ch of chapters){
    if(ch.images && ch.images.length){
      const im = ch.images[0];
      return { data: im.data, ext: im.name.split(".").pop(), mediaType: im.mediaType };
    }
  }
  return null;
}

/* ---------- Make content valid XHTML (optionally embedding images) ---------- */
async function processContent(htmlString, baseUrl, chapIndex, withImages){
  const doc = new DOMParser().parseFromString(htmlString || "", "text/html");
  doc.querySelectorAll("script,style,iframe,video,audio,source,noscript,svg,form,button,input,link")
     .forEach(n => n.remove());
  doc.querySelectorAll("picture").forEach(p => {           // flatten <picture> to its <img>
    const im = p.querySelector("img");
    if(im) p.replaceWith(im); else p.remove();
  });

  const images = [];
  if(withImages){
    let imgIdx = 0;
    for(const img of [...doc.querySelectorAll("img")]){
      const url = pickImageUrl(img, baseUrl);
      if(!url || !isLikelyContentImage(img, url)){ img.remove(); continue; }
      try {
        const { buf, type } = await fetchBytes(url);
        const prep = await prepareImage(buf, type);
        if(!prep){ img.remove(); continue; }
        const alt = img.getAttribute("alt") || "";
        const name = `img/c${chapIndex}_${imgIdx++}.${prep.ext}`;
        images.push({ name, mediaType: prep.mediaType, data: prep.data });
        [...img.attributes].forEach(a => img.removeAttribute(a.name));
        img.setAttribute("src", name);
        if(alt) img.setAttribute("alt", alt);
      } catch(e){ img.remove(); }
    }
  } else {
    doc.querySelectorAll("img, figure").forEach(n => n.remove());
  }

  const ser = new XMLSerializer();
  const inner = [...doc.body.childNodes].map(n => ser.serializeToString(n)).join("").trim();
  return { html: inner || "<p>(No readable content could be extracted.)</p>", images };
}

const STYLE_CSS = `body { font-family: Georgia, "Times New Roman", serif; line-height: 1.5; margin: 5% 6%; }
h1 { font-size: 1.5em; line-height: 1.25; margin: 0 0 0.75em; }
p { margin: 0 0 1em; }
img { max-width: 100%; height: auto; }
figure { margin: 1em 0; text-align: center; }
figcaption { font-size: 0.85em; color: #555; margin-top: 0.3em; }
.cover { text-align: center; margin-top: 25%; }
.cover-title { font-size: 2em; margin: 0 0 0.5em; }
.cover-meta { color: #555; }
ol.toc { padding-left: 1.2em; }
ol.toc li { margin: 0.5em 0; }
ol.toc a { text-decoration: none; }
.byline { color: #555; font-style: italic; margin: 0 0 0.25em; }
.source { margin: 0 0 1.5em; font-size: 0.9em; }
.cover img { max-width: 70%; height: auto; display: block; margin: 10% auto 1em; }`;

function pageXhtml(title, bodyInner){
  return `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8"/><title>${esc(title)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
<body>
${bodyInner}
</body>
</html>`;
}

function bylineHtml(ch){
  const bits = [];
  if(ch.author) bits.push(esc(ch.author));
  if(ch.date) bits.push(esc(ch.date.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" })));
  const meta = bits.length ? `<p class="byline">${bits.join(" · ")}</p>` : "";
  const src = ch.link ? `<p class="source"><a href="${esc(ch.link)}">Read original ↗</a></p>` : "";
  return meta + src;
}

function chapterXhtml(ch){
  return pageXhtml(ch.title, `<h1>${esc(ch.title)}</h1>\n${bylineHtml(ch)}\n${ch.html}`);
}

/* ---------- EPUB 2 builder (JSZip only) ---------- */
async function buildEpub({ title, author, chapters, front = false, cover = null }){
  const zip = new JSZip();
  zip.file("mimetype", "application/epub+zip", { compression: "STORE" });
  zip.file("META-INF/container.xml",
`<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
  </rootfiles>
</container>`);
  zip.file("OEBPS/style.css", STYLE_CSS);

  const uid = "urn:uuid:" + crypto.randomUUID();
  const manifest = [`<item id="css" href="style.css" media-type="text/css"/>`];
  const spine = [], nav = [], guide = [];
  let play = 1;

  if(front){
    const date = new Date().toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
    const n = chapters.length;
    const meta = `<p class="cover-meta">${n} article${n>1?"s":""} · ${esc(date)}</p>`;
    if(cover){
      zip.file("OEBPS/cover." + cover.ext, cover.data);
      manifest.push(`<item id="cover-img" href="cover.${cover.ext}" media-type="${cover.mediaType}"/>`);
      zip.file("OEBPS/cover.xhtml", pageXhtml(title,
        `<div class="cover"><img src="cover.${cover.ext}" alt="${esc(title)}"/>
      <h1 class="cover-title">${esc(title)}</h1>
      ${meta}</div>`));
      manifest.push(`<item id="coverpage" href="cover.xhtml" media-type="application/xhtml+xml"/>`);
      spine.push(`<itemref idref="coverpage"/>`);
      guide.push(`<reference type="cover" title="Cover" href="cover.xhtml"/>`);
    } else {
      zip.file("OEBPS/title.xhtml", pageXhtml(title,
        `<div class="cover"><h1 class="cover-title">${esc(title)}</h1>
      ${meta}</div>`));
      manifest.push(`<item id="titlepage" href="title.xhtml" media-type="application/xhtml+xml"/>`);
      spine.push(`<itemref idref="titlepage"/>`);
      guide.push(`<reference type="cover" title="Title Page" href="title.xhtml"/>`);
    }

    const tocLinks = chapters.map((ch, i) => `<li><a href="ch${i+1}.xhtml">${esc(ch.title)}</a></li>`).join("\n      ");
    zip.file("OEBPS/toc.xhtml", pageXhtml("Contents", `<h1>Contents</h1>\n<ol class="toc">\n      ${tocLinks}\n</ol>`));
    manifest.push(`<item id="tocpage" href="toc.xhtml" media-type="application/xhtml+xml"/>`);
    spine.push(`<itemref idref="tocpage"/>`);
    guide.push(`<reference type="toc" title="Contents" href="toc.xhtml"/>`);
    nav.push(`<navPoint id="np-toc" playOrder="${play++}"><navLabel><text>Contents</text></navLabel><content src="toc.xhtml"/></navPoint>`);
  }

  chapters.forEach((ch, i) => {
    const id = "ch" + (i+1), file = id + ".xhtml";
    zip.file("OEBPS/" + file, chapterXhtml(ch));
    manifest.push(`<item id="${id}" href="${file}" media-type="application/xhtml+xml"/>`);
    spine.push(`<itemref idref="${id}"/>`);
    nav.push(`<navPoint id="np${i+1}" playOrder="${play++}"><navLabel><text>${esc(ch.title)}</text></navLabel><content src="${file}"/></navPoint>`);
    (ch.images || []).forEach((im, j) => {
      zip.file("OEBPS/" + im.name, im.data);
      manifest.push(`<item id="img${i+1}_${j}" href="${im.name}" media-type="${im.mediaType}"/>`);
    });
  });

  zip.file("OEBPS/content.opf",
`<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="bookid">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:identifier id="bookid">${uid}</dc:identifier>
    <dc:title>${esc(title)}</dc:title>
    <dc:creator>${esc(author)}</dc:creator>
    <dc:language>en</dc:language>
    <dc:date>${new Date().toISOString().slice(0,10)}</dc:date>${cover ? `
    <meta name="cover" content="cover-img"/>` : ""}
  </metadata>
  <manifest>
    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
    ${manifest.join("\n    ")}
  </manifest>
  <spine toc="ncx">
    ${spine.join("\n    ")}
  </spine>${guide.length ? `
  <guide>
    ${guide.join("\n    ")}
  </guide>` : ""}
</package>`);

  zip.file("OEBPS/toc.ncx",
`<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head><meta name="dtb:uid" content="${uid}"/></head>
  <docTitle><text>${esc(title)}</text></docTitle>
  <navMap>
    ${nav.join("\n    ")}
  </navMap>
</ncx>`);

  return zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
}

/* ---------- small concurrency pool, preserves order ---------- */
async function pool(items, size, worker){
  let i = 0;
  const runners = Array.from({ length: Math.min(size, items.length) }, async () => {
    while(i < items.length){ const idx = i++; await worker(items[idx], idx); }
  });
  await Promise.all(runners);
}

function download(blob, name){
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- main ---------- */
async function run(){
  const feedUrl = $("feed").value.trim();
  if(!feedUrl){ status("Enter a feed URL first."); return; }
  const mode = document.querySelector('input[name=mode]:checked').value;
  const maxCount = Math.max(0, parseInt($("count").value) || 0);
  const days = Math.max(0, parseInt($("days").value) || 0);
  const skipSeen = $("skipSeen").checked;
  const withImages = $("withImages").checked;

  $("go").disabled = true; logEl.textContent = ""; logEl.style.display = "none"; status("Fetching feed…");
  try {
    const xmlText = await fetchText(feedUrl);
    let channelTitle, channelImage, all;
    try {
      ({ channelTitle, channelImage, items: all } = parseFeed(xmlText));
    } catch(e){
      log("The response didn't parse as a feed. First 300 chars received:");
      log(xmlText.slice(0, 300).trim() || "(empty response)");
      throw e;
    }
    log(`Found ${all.length} item(s) in “${channelTitle}”.`);

    let items = all;
    if(days > 0){
      const cutoff = Date.now() - days*86400000;
      items = items.filter(it => !it.date || it.date.getTime() >= cutoff);
      log(`${items.length} within the last ${days} day(s).`);
    }

    const seenKey = "rss2epub:" + feedUrl;
    const seen = new Set(JSON.parse(localStorage.getItem(seenKey) || "[]"));
    if(skipSeen){
      const before = items.length;
      items = items.filter(it => !seen.has(it.guid));
      log(`${before - items.length} already downloaded, skipping them.`);
    }

    if(maxCount > 0 && items.length > maxCount){ items = items.slice(0, maxCount); log(`Limiting to newest ${maxCount}.`); }

    if(!items.length){ status("Nothing new to fetch after your filters."); $("go").disabled = false; return; }

    status(`Fetching ${items.length} article(s)…`);
    const chapters = new Array(items.length);
    let done = 0;
    await pool(items, 3, async (it, idx) => {
      let raw;
      try { raw = await getArticleHtml(it); }
      catch(e){ log(`  ! ${it.title} — ${e.message}`); raw = it.summary || it.feedHtml || ""; }
      const { html, images } = await processContent(raw, it.link || feedUrl, idx, withImages);
      chapters[idx] = { guid: it.guid, title: it.title, html, images, link: it.link, author: it.author, date: it.date };
      done++; status(`Fetched ${done}/${items.length}…`);
      log(`✓ ${it.title}${images.length ? ` (${images.length} image${images.length>1?"s":""})` : ""}`);
    });

    const got = chapters.filter(Boolean);
    status("Building EPUB…");
    if(mode === "combined"){
      const cover = await getCoverImage(channelImage, got);
      download(await buildEpub({ title: channelTitle, author: "RSS → EPUB", chapters: got, front: true, cover }), safe(channelTitle) + ".epub");
    } else {
      const zip = new JSZip();
      for(const ch of got){
        zip.file(safe(ch.title) + ".epub", await buildEpub({ title: ch.title, author: "RSS → EPUB", chapters: [ch] }));
      }
      download(await zip.generateAsync({ type: "blob" }), safe(channelTitle) + "-articles.zip");
    }

    if(skipSeen){
      got.forEach(ch => seen.add(ch.guid));
      localStorage.setItem(seenKey, JSON.stringify([...seen]));
    }
    status(`Done — ${got.length} article(s). Check your downloads.`);
  } catch(e){
    status("Error: " + e.message);
    log("ERROR: " + e.message);
  } finally {
    $("go").disabled = false;
  }
}

/* ---------- saved feeds (localStorage) ---------- */
const FEEDS_KEY = "rss2epub:feeds";
function loadFeeds(){ try { return JSON.parse(localStorage.getItem(FEEDS_KEY) || "[]"); } catch { return []; } }
function saveFeeds(list){ localStorage.setItem(FEEDS_KEY, JSON.stringify(list)); }
function feedLabel(url){
  try { const u = new URL(url); return u.hostname.replace(/^www\./, "") + (u.pathname !== "/" ? u.pathname : ""); }
  catch { return url; }
}
function renderFeeds(selected){
  const sel = $("saved");
  const list = loadFeeds();
  sel.innerHTML = '<option value="">Saved feeds…</option>' +
    list.map(u => `<option value="${esc(u)}"${u === selected ? " selected" : ""}>${esc(feedLabel(u))}</option>`).join("");
}

$("saved").addEventListener("change", e => { if(e.target.value) $("feed").value = e.target.value; });
$("saveFeed").addEventListener("click", () => {
  const url = $("feed").value.trim();
  if(!url){ status("Enter a feed URL to save."); return; }
  const list = loadFeeds();
  if(list.includes(url)){ status("That feed is already saved."); renderFeeds(url); return; }
  list.push(url); saveFeeds(list); renderFeeds(url);
  status("Feed saved.");
});
$("removeFeed").addEventListener("click", () => {
  const url = $("saved").value || $("feed").value.trim();
  if(!url){ status("Pick a saved feed to remove."); return; }
  saveFeeds(loadFeeds().filter(u => u !== url));
  renderFeeds();
  status("Feed removed.");
});
renderFeeds();

$("go").addEventListener("click", run);
$("reset").addEventListener("click", () => {
  const feedUrl = $("feed").value.trim();
  if(!feedUrl){ status("Enter the feed URL whose history you want to reset."); return; }
  localStorage.removeItem("rss2epub:" + feedUrl);
  status("Download history cleared for this feed.");
});
</script>
